<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120" role="img" aria-labelledby="title desc">
<title id="title">RISC-V 六种 32 位指令格式及 B/J 立即数重建</title>
<desc id="desc">上方逐位标明 inst[31:0]，六行按比例展示 R、I、S、B、U、J 的字段。紫色块内标明立即数位号；B/J 的每段立即数单独绘制。下方按数值位序重建 B 型 13 位和 J 型 21 位偏移，并显示隐含的最低位 0。</desc>
<defs><style>text{font-family:Microsoft YaHei,Noto Sans CJK SC,sans-serif;fill:#172033}.title{font-size:32px;font-weight:700}.label{font-size:23px;font-weight:700}.field{font-family:Consolas,monospace;font-size:20px;font-weight:600}.note{font-size:21px;fill:#475569}.bit{font-family:Consolas,monospace;font-size:18px;fill:#475569}.imm{fill:#e9d5ff;stroke:#7e22ce}.rs{fill:#dbeafe;stroke:#2563eb}.fun{fill:#dcfce7;stroke:#16a34a}.rd{fill:#fed7aa;stroke:#ea580c}.op{fill:#fecaca;stroke:#dc2626}.zero{fill:#f1f5f9;stroke:#64748b;stroke-dasharray:5 3}rect.seg{stroke-width:1.5}</style></defs>
<rect width="1600" height="1120" rx="18" fill="#f8fafc"/>
<text x="800" y="49" text-anchor="middle" class="title">RISC-V 六种基本指令格式（每行均为 32 位）</text>
<text x="800" y="90" text-anchor="middle" class="note">上方是指令位号 inst；紫色块内是立即数位号 imm。色块宽度与位数成正比。</text>
<text x="220" y="132" text-anchor="middle" class="bit">31</text>
<text x="260" y="132" text-anchor="middle" class="bit">30</text>
<text x="300" y="132" text-anchor="middle" class="bit">29</text>
<text x="340" y="132" text-anchor="middle" class="bit">28</text>
<text x="380" y="132" text-anchor="middle" class="bit">27</text>
<text x="420" y="132" text-anchor="middle" class="bit">26</text>
<text x="460" y="132" text-anchor="middle" class="bit">25</text>
<text x="500" y="132" text-anchor="middle" class="bit">24</text>
<text x="540" y="132" text-anchor="middle" class="bit">23</text>
<text x="580" y="132" text-anchor="middle" class="bit">22</text>
<text x="620" y="132" text-anchor="middle" class="bit">21</text>
<text x="660" y="132" text-anchor="middle" class="bit">20</text>
<text x="700" y="132" text-anchor="middle" class="bit">19</text>
<text x="740" y="132" text-anchor="middle" class="bit">18</text>
<text x="780" y="132" text-anchor="middle" class="bit">17</text>
<text x="820" y="132" text-anchor="middle" class="bit">16</text>
<text x="860" y="132" text-anchor="middle" class="bit">15</text>
<text x="900" y="132" text-anchor="middle" class="bit">14</text>
<text x="940" y="132" text-anchor="middle" class="bit">13</text>
<text x="980" y="132" text-anchor="middle" class="bit">12</text>
<text x="1020" y="132" text-anchor="middle" class="bit">11</text>
<text x="1060" y="132" text-anchor="middle" class="bit">10</text>
<text x="1100" y="132" text-anchor="middle" class="bit">9</text>
<text x="1140" y="132" text-anchor="middle" class="bit">8</text>
<text x="1180" y="132" text-anchor="middle" class="bit">7</text>
<text x="1220" y="132" text-anchor="middle" class="bit">6</text>
<text x="1260" y="132" text-anchor="middle" class="bit">5</text>
<text x="1300" y="132" text-anchor="middle" class="bit">4</text>
<text x="1340" y="132" text-anchor="middle" class="bit">3</text>
<text x="1380" y="132" text-anchor="middle" class="bit">2</text>
<text x="1420" y="132" text-anchor="middle" class="bit">1</text>
<text x="1460" y="132" text-anchor="middle" class="bit">0</text>
<text x="90" y="179" dominant-baseline="middle" text-anchor="middle" class="label">R</text>
<rect class="seg fun" x="200" y="150" width="280" height="56"/><text class="field" x="340" y="179" dominant-baseline="middle" text-anchor="middle">funct7</text>
<rect class="seg rs" x="480" y="150" width="200" height="56"/><text class="field" x="580" y="179" dominant-baseline="middle" text-anchor="middle">rs2</text>
<rect class="seg rs" x="680" y="150" width="200" height="56"/><text class="field" x="780" y="179" dominant-baseline="middle" text-anchor="middle">rs1</text>
<rect class="seg fun" x="880" y="150" width="120" height="56"/><text class="field" x="940" y="179" dominant-baseline="middle" text-anchor="middle">funct3</text>
<rect class="seg rd" x="1000" y="150" width="200" height="56"/><text class="field" x="1100" y="179" dominant-baseline="middle" text-anchor="middle">rd</text>
<rect class="seg op" x="1200" y="150" width="280" height="56"/><text class="field" x="1340" y="179" dominant-baseline="middle" text-anchor="middle">opcode</text>
<text x="90" y="274" dominant-baseline="middle" text-anchor="middle" class="label">I</text>
<rect class="seg imm" x="200" y="245" width="480" height="56"/><text class="field" x="440" y="274" dominant-baseline="middle" text-anchor="middle">imm[11:0]</text>
<rect class="seg rs" x="680" y="245" width="200" height="56"/><text class="field" x="780" y="274" dominant-baseline="middle" text-anchor="middle">rs1</text>
<rect class="seg fun" x="880" y="245" width="120" height="56"/><text class="field" x="940" y="274" dominant-baseline="middle" text-anchor="middle">funct3</text>
<rect class="seg rd" x="1000" y="245" width="200" height="56"/><text class="field" x="1100" y="274" dominant-baseline="middle" text-anchor="middle">rd</text>
<rect class="seg op" x="1200" y="245" width="280" height="56"/><text class="field" x="1340" y="274" dominant-baseline="middle" text-anchor="middle">opcode</text>
<text x="90" y="369" dominant-baseline="middle" text-anchor="middle" class="label">S</text>
<rect class="seg imm" x="200" y="340" width="280" height="56"/><text class="field" x="340" y="369" dominant-baseline="middle" text-anchor="middle">imm[11:5]</text>
<rect class="seg rs" x="480" y="340" width="200" height="56"/><text class="field" x="580" y="369" dominant-baseline="middle" text-anchor="middle">rs2</text>
<rect class="seg rs" x="680" y="340" width="200" height="56"/><text class="field" x="780" y="369" dominant-baseline="middle" text-anchor="middle">rs1</text>
<rect class="seg fun" x="880" y="340" width="120" height="56"/><text class="field" x="940" y="369" dominant-baseline="middle" text-anchor="middle">funct3</text>
<rect class="seg imm" x="1000" y="340" width="200" height="56"/><text class="field" x="1100" y="369" dominant-baseline="middle" text-anchor="middle">imm[4:0]</text>
<rect class="seg op" x="1200" y="340" width="280" height="56"/><text class="field" x="1340" y="369" dominant-baseline="middle" text-anchor="middle">opcode</text>
<text x="90" y="464" dominant-baseline="middle" text-anchor="middle" class="label">B</text>
<rect class="seg imm" x="200" y="435" width="40" height="56"/><text class="field" x="220" y="464" dominant-baseline="middle" text-anchor="middle">12</text>
<rect class="seg imm" x="240" y="435" width="240" height="56"/><text class="field" x="360" y="464" dominant-baseline="middle" text-anchor="middle">imm[10:5]</text>
<rect class="seg rs" x="480" y="435" width="200" height="56"/><text class="field" x="580" y="464" dominant-baseline="middle" text-anchor="middle">rs2</text>
<rect class="seg rs" x="680" y="435" width="200" height="56"/><text class="field" x="780" y="464" dominant-baseline="middle" text-anchor="middle">rs1</text>
<rect class="seg fun" x="880" y="435" width="120" height="56"/><text class="field" x="940" y="464" dominant-baseline="middle" text-anchor="middle">funct3</text>
<rect class="seg imm" x="1000" y="435" width="160" height="56"/><text class="field" x="1080" y="464" dominant-baseline="middle" text-anchor="middle">imm[4:1]</text>
<rect class="seg imm" x="1160" y="435" width="40" height="56"/><text class="field" x="1180" y="464" dominant-baseline="middle" text-anchor="middle">11</text>
<rect class="seg op" x="1200" y="435" width="280" height="56"/><text class="field" x="1340" y="464" dominant-baseline="middle" text-anchor="middle">opcode</text>
<text x="90" y="559" dominant-baseline="middle" text-anchor="middle" class="label">U</text>
<rect class="seg imm" x="200" y="530" width="800" height="56"/><text class="field" x="600" y="559" dominant-baseline="middle" text-anchor="middle">imm[31:12]</text>
<rect class="seg rd" x="1000" y="530" width="200" height="56"/><text class="field" x="1100" y="559" dominant-baseline="middle" text-anchor="middle">rd</text>
<rect class="seg op" x="1200" y="530" width="280" height="56"/><text class="field" x="1340" y="559" dominant-baseline="middle" text-anchor="middle">opcode</text>
<text x="90" y="654" dominant-baseline="middle" text-anchor="middle" class="label">J</text>
<rect class="seg imm" x="200" y="625" width="40" height="56"/><text class="field" x="220" y="654" dominant-baseline="middle" text-anchor="middle">20</text>
<rect class="seg imm" x="240" y="625" width="400" height="56"/><text class="field" x="440" y="654" dominant-baseline="middle" text-anchor="middle">imm[10:1]</text>
<rect class="seg imm" x="640" y="625" width="40" height="56"/><text class="field" x="660" y="654" dominant-baseline="middle" text-anchor="middle">11</text>
<rect class="seg imm" x="680" y="625" width="320" height="56"/><text class="field" x="840" y="654" dominant-baseline="middle" text-anchor="middle">imm[19:12]</text>
<rect class="seg rd" x="1000" y="625" width="200" height="56"/><text class="field" x="1100" y="654" dominant-baseline="middle" text-anchor="middle">rd</text>
<rect class="seg op" x="1200" y="625" width="280" height="56"/><text class="field" x="1340" y="654" dominant-baseline="middle" text-anchor="middle">opcode</text>
<rect class="seg imm" x="210" y="713" width="34" height="23"/><text class="note" x="256" y="733">立即数</text>
<rect class="seg rs" x="440" y="713" width="34" height="23"/><text class="note" x="486" y="733">源寄存器</text>
<rect class="seg fun" x="700" y="713" width="34" height="23"/><text class="note" x="746" y="733">功能码</text>
<rect class="seg rd" x="920" y="713" width="34" height="23"/><text class="note" x="966" y="733">目的寄存器</text>
<rect class="seg op" x="1200" y="713" width="34" height="23"/><text class="note" x="1246" y="733">操作码</text>
<text x="800" y="773" text-anchor="middle" class="note">窄紫色块中的 12、11、20 分别表示 imm[12]、imm[11]、imm[20]。</text>
<line x1="55" y1="800" x2="1545" y2="800" stroke="#cbd5e1"/>
<text x="800" y="837" text-anchor="middle" class="label">重建后的字节偏移：按立即数位号从高到低排列，最低位补 0，再符号扩展</text>
<text x="90" y="898" text-anchor="middle" dominant-baseline="middle" class="label">B</text>
<rect class="seg imm" x="200" y="870" width="40" height="54"/><text class="field" x="220" y="898" dominant-baseline="middle" text-anchor="middle">12</text>
<rect class="seg imm" x="240" y="870" width="40" height="54"/><text class="field" x="260" y="898" dominant-baseline="middle" text-anchor="middle">11</text>
<rect class="seg imm" x="280" y="870" width="240" height="54"/><text class="field" x="400" y="898" dominant-baseline="middle" text-anchor="middle">10:5</text>
<rect class="seg imm" x="520" y="870" width="160" height="54"/><text class="field" x="600" y="898" dominant-baseline="middle" text-anchor="middle">4:1</text>
<rect class="seg zero" x="680" y="870" width="40" height="54"/><text class="field" x="700" y="898" dominant-baseline="middle" text-anchor="middle">0</text>
<text class="note" x="840" y="898">-4096 ～ 4094 字节（步长 2）</text>
<text x="90" y="997" text-anchor="middle" dominant-baseline="middle" class="label">J</text>
<rect class="seg imm" x="200" y="969" width="40" height="54"/><text class="field" x="220" y="997" dominant-baseline="middle" text-anchor="middle">20</text>
<rect class="seg imm" x="240" y="969" width="320" height="54"/><text class="field" x="400" y="997" dominant-baseline="middle" text-anchor="middle">19:12</text>
<rect class="seg imm" x="560" y="969" width="40" height="54"/><text class="field" x="580" y="997" dominant-baseline="middle" text-anchor="middle">11</text>
<rect class="seg imm" x="600" y="969" width="400" height="54"/><text class="field" x="800" y="997" dominant-baseline="middle" text-anchor="middle">10:1</text>
<rect class="seg zero" x="1000" y="969" width="40" height="54"/><text class="field" x="1020" y="997" dominant-baseline="middle" text-anchor="middle">0</text>
<text class="note" x="1100" y="997">-1048576 ～ 1048574 字节</text>
<text class="note" x="1100" y="1024">步长 2 字节；灰框为隐含位</text>
<text x="800" y="1080" text-anchor="middle" class="note">目标 = 当前 PC + 偏移；纯基础 ISA 要求 4 字节对齐，启用 C 等扩展后可按 2 字节对齐。</text>
</svg>
