<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">RISC-V 六种 32 位指令格式</title>
  <desc id="desc">R、I、S、B、U、J 六种格式的立即数、寄存器、功能码和操作码位段。</desc>
  <defs><style>
    text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#172033}.t{font-size:28px;font-weight:700}.h{font-size:20px;font-weight:700}.s{font-size:14px;font-weight:600}.bit{font-size:14px;fill:#475569}
    .imm{fill:#e9d5ff;stroke:#7e22ce}.rs{fill:#dbeafe;stroke:#2563eb}.fun{fill:#dcfce7;stroke:#16a34a}.rd{fill:#fed7aa;stroke:#ea580c}.op{fill:#fecaca;stroke:#dc2626}.seg{stroke-width:1.5}
  </style></defs>
  <rect width="1200" height="680" rx="18" fill="#f8fafc"/>
  <text x="600" y="45" text-anchor="middle" class="t">RISC-V 六种基本指令格式（均为 32 位）</text>
  <text x="150" y="80" class="bit">31</text><text x="1110" y="80" text-anchor="end" class="bit">0</text>
  <g text-anchor="middle" dominant-baseline="middle">
    <text x="80" y="120" class="h">R</text>
    <rect class="seg fun" x="150" y="95" width="210" height="50"/><text class="s" x="255" y="120">funct7 [31:25]</text>
    <rect class="seg rs" x="360" y="95" width="150" height="50"/><text class="s" x="435" y="120">rs2 [24:20]</text>
    <rect class="seg rs" x="510" y="95" width="150" height="50"/><text class="s" x="585" y="120">rs1 [19:15]</text>
    <rect class="seg fun" x="660" y="95" width="90" height="50"/><text class="s" x="705" y="120">funct3</text>
    <rect class="seg rd" x="750" y="95" width="150" height="50"/><text class="s" x="825" y="120">rd [11:7]</text>
    <rect class="seg op" x="900" y="95" width="210" height="50"/><text class="s" x="1005" y="120">opcode [6:0]</text>

    <text x="80" y="205" class="h">I</text>
    <rect class="seg imm" x="150" y="180" width="360" height="50"/><text class="s" x="330" y="205">imm[11:0]</text>
    <rect class="seg rs" x="510" y="180" width="150" height="50"/><text class="s" x="585" y="205">rs1</text>
    <rect class="seg fun" x="660" y="180" width="90" height="50"/><text class="s" x="705" y="205">funct3</text>
    <rect class="seg rd" x="750" y="180" width="150" height="50"/><text class="s" x="825" y="205">rd</text>
    <rect class="seg op" x="900" y="180" width="210" height="50"/><text class="s" x="1005" y="205">opcode</text>

    <text x="80" y="290" class="h">S</text>
    <rect class="seg imm" x="150" y="265" width="210" height="50"/><text class="s" x="255" y="290">imm[11:5]</text>
    <rect class="seg rs" x="360" y="265" width="150" height="50"/><text class="s" x="435" y="290">rs2</text>
    <rect class="seg rs" x="510" y="265" width="150" height="50"/><text class="s" x="585" y="290">rs1</text>
    <rect class="seg fun" x="660" y="265" width="90" height="50"/><text class="s" x="705" y="290">funct3</text>
    <rect class="seg imm" x="750" y="265" width="150" height="50"/><text class="s" x="825" y="290">imm[4:0]</text>
    <rect class="seg op" x="900" y="265" width="210" height="50"/><text class="s" x="1005" y="290">opcode</text>

    <text x="80" y="375" class="h">B</text>
    <rect class="seg imm" x="150" y="350" width="210" height="50"/><text class="s" x="255" y="375">imm[12|10:5]</text>
    <rect class="seg rs" x="360" y="350" width="150" height="50"/><text class="s" x="435" y="375">rs2</text>
    <rect class="seg rs" x="510" y="350" width="150" height="50"/><text class="s" x="585" y="375">rs1</text>
    <rect class="seg fun" x="660" y="350" width="90" height="50"/><text class="s" x="705" y="375">funct3</text>
    <rect class="seg imm" x="750" y="350" width="150" height="50"/><text class="s" x="825" y="375">imm[4:1|11]</text>
    <rect class="seg op" x="900" y="350" width="210" height="50"/><text class="s" x="1005" y="375">opcode</text>

    <text x="80" y="460" class="h">U</text>
    <rect class="seg imm" x="150" y="435" width="600" height="50"/><text class="s" x="450" y="460">imm[31:12]</text>
    <rect class="seg rd" x="750" y="435" width="150" height="50"/><text class="s" x="825" y="460">rd</text>
    <rect class="seg op" x="900" y="435" width="210" height="50"/><text class="s" x="1005" y="460">opcode</text>

    <text x="80" y="545" class="h">J</text>
    <rect class="seg imm" x="150" y="520" width="600" height="50"/><text class="s" x="450" y="545">imm[20|10:1|11|19:12]</text>
    <rect class="seg rd" x="750" y="520" width="150" height="50"/><text class="s" x="825" y="545">rd</text>
    <rect class="seg op" x="900" y="520" width="210" height="50"/><text class="s" x="1005" y="545">opcode</text>
  </g>
  <g class="s"><rect class="imm" x="210" y="610" width="34" height="20"/><text x="252" y="626">立即数</text><rect class="rs" x="345" y="610" width="34" height="20"/><text x="387" y="626">源寄存器</text><rect class="fun" x="500" y="610" width="34" height="20"/><text x="542" y="626">功能码</text><rect class="rd" x="635" y="610" width="34" height="20"/><text x="677" y="626">目的寄存器</text><rect class="op" x="810" y="610" width="34" height="20"/><text x="852" y="626">操作码</text></g>
  <text x="600" y="660" text-anchor="middle" class="bit">B/J 的立即数字段重排，使 rs、rd、opcode 位置尽量固定；最低位 0 隐含不编码。</text>
</svg>
