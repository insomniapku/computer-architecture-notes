<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="620" viewBox="0 0 1120 620" role="img" aria-labelledby="title desc">
  <title id="title">单周期、多周期与流水线执行时序比较</title>
  <desc id="desc">三种处理器组织执行三条指令的时间安排，流水线在不同阶段重叠多条指令。</desc>
  <defs><style>
    text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#172033}.t{font-size:28px;font-weight:700}.h{font-size:20px;font-weight:700}.s{font-size:15px}.cycle{font-size:13px;fill:#475569}
    .if{fill:#dbeafe}.id{fill:#e9d5ff}.ex{fill:#dcfce7}.mem{fill:#fef3c7}.wb{fill:#fed7aa}.idle{fill:#e2e8f0}.cell{stroke:#64748b;stroke-width:1}.axis{stroke:#64748b;stroke-width:1.5}
  </style></defs>
  <rect width="1120" height="620" rx="18" fill="#f8fafc"/>
  <text x="560" y="44" text-anchor="middle" class="t">单周期、多周期与五级流水线</text>
  <g text-anchor="middle" class="cycle"><text x="250" y="85">周期1</text><text x="350" y="85">周期2</text><text x="450" y="85">周期3</text><text x="550" y="85">周期4</text><text x="650" y="85">周期5</text><text x="750" y="85">周期6</text><text x="850" y="85">周期7</text><text x="950" y="85">周期8</text></g>
  <g><text x="35" y="145" class="h">单周期</text><rect class="cell idle" x="200" y="110" width="300" height="55"/><text x="350" y="143" text-anchor="middle" class="s">ld：一个很长的周期</text><rect class="cell idle" x="500" y="110" width="300" height="55"/><text x="650" y="143" text-anchor="middle" class="s">sd：仍按最慢指令定周期</text><text x="825" y="143" class="s">CPI≈1，但周期长</text></g>
  <g><text x="35" y="250" class="h">多周期</text><rect class="cell if" x="200" y="205" width="100" height="55"/><rect class="cell id" x="300" y="205" width="100" height="55"/><rect class="cell ex" x="400" y="205" width="100" height="55"/><rect class="cell mem" x="500" y="205" width="100" height="55"/><rect class="cell wb" x="600" y="205" width="100" height="55"/><text x="250" y="238" text-anchor="middle" class="s">IF</text><text x="350" y="238" text-anchor="middle" class="s">ID</text><text x="450" y="238" text-anchor="middle" class="s">EX</text><text x="550" y="238" text-anchor="middle" class="s">MEM</text><text x="650" y="238" text-anchor="middle" class="s">WB</text><text x="740" y="238" class="s">一条 ld 占 5 个短周期</text></g>
  <text x="35" y="355" class="h">流水线</text>
  <g text-anchor="middle" class="s">
    <text x="130" y="330">指令1</text><rect class="cell if" x="200" y="300" width="100" height="55"/><text x="250" y="333">IF</text><rect class="cell id" x="300" y="300" width="100" height="55"/><text x="350" y="333">ID</text><rect class="cell ex" x="400" y="300" width="100" height="55"/><text x="450" y="333">EX</text><rect class="cell mem" x="500" y="300" width="100" height="55"/><text x="550" y="333">MEM</text><rect class="cell wb" x="600" y="300" width="100" height="55"/><text x="650" y="333">WB</text>
    <text x="130" y="395">指令2</text><rect class="cell if" x="300" y="365" width="100" height="55"/><text x="350" y="398">IF</text><rect class="cell id" x="400" y="365" width="100" height="55"/><text x="450" y="398">ID</text><rect class="cell ex" x="500" y="365" width="100" height="55"/><text x="550" y="398">EX</text><rect class="cell mem" x="600" y="365" width="100" height="55"/><text x="650" y="398">MEM</text><rect class="cell wb" x="700" y="365" width="100" height="55"/><text x="750" y="398">WB</text>
    <text x="130" y="460">指令3</text><rect class="cell if" x="400" y="430" width="100" height="55"/><text x="450" y="463">IF</text><rect class="cell id" x="500" y="430" width="100" height="55"/><text x="550" y="463">ID</text><rect class="cell ex" x="600" y="430" width="100" height="55"/><text x="650" y="463">EX</text><rect class="cell mem" x="700" y="430" width="100" height="55"/><text x="750" y="463">MEM</text><rect class="cell wb" x="800" y="430" width="100" height="55"/><text x="850" y="463">WB</text>
  </g>
  <line class="axis" x1="200" y1="510" x2="1000" y2="510"/>
  <g class="s"><rect class="if" x="180" y="545" width="35" height="20"/><text x="222" y="561">IF 取指</text><rect class="id" x="340" y="545" width="35" height="20"/><text x="382" y="561">ID 译码</text><rect class="ex" x="500" y="545" width="35" height="20"/><text x="542" y="561">EX 执行</text><rect class="mem" x="660" y="545" width="35" height="20"/><text x="702" y="561">MEM 访存</text><rect class="wb" x="845" y="545" width="35" height="20"/><text x="887" y="561">WB 写回</text></g>
  <text x="560" y="598" text-anchor="middle" class="h">流水线重叠多条指令：单条延迟不一定下降，但填满后理想吞吐为每周期 1 条。</text>
</svg>
