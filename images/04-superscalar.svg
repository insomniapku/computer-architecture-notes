<path d="M715,365 L715,385 L640.0,385 L640.0,410" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M640.0,475 L640.0,505 L590,505 L590,535" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="775" y="410" width="230" height="65" rx="8" fill="#dcfce7" stroke="#64748b" stroke-width="1.5"/>
