<path d="M405.0,475 L405.0,505 L590,505 L590,535" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="540" y="410" width="200" height="65" rx="8" fill="#dcfce7" stroke="#64748b" stroke-width="1.5"/>
