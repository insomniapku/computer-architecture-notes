<rect x="385" y="635" width="410" height="55" rx="8" fill="#e9d5ff" stroke="#64748b" stroke-width="1.5"/>
<text x="590" y="671" class="body" text-anchor="middle">按程序顺序提交，维持精确异常</text>
<path d="M795,568 L1080,568 L1080,170 L840,170" fill="none" stroke="#15803d" stroke-width="3" marker-end="url(#green)"/>
<text x="1100" y="360" class="body" text-anchor="middle" style="fill:#15803d">转发</text>
<text x="1100" y="390" class="body" text-anchor="middle" style="fill:#15803d">唤醒</text>
