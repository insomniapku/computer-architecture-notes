<svg xmlns="http://www.w3.org/2000/svg" width="960" height="580" viewBox="0 0 960 580" role="img" aria-labelledby="title desc">
  <title id="title">处理器、存储器和输入输出系统</title>
  <desc id="desc">CPU 经缓存和系统互连连接主存与输入输出设备，CPU 内含取指、控制、寄存器、ALU 和 FPU。</desc>
  <defs>
    <style>
      text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#172033}.t{font-size:29px;font-weight:700}.h{font-size:22px;font-weight:700}.s{font-size:17px}
      .cpu{fill:#dbeafe;stroke:#2563eb;stroke-width:2}.mem{fill:#dcfce7;stroke:#16a34a;stroke-width:2}.io{fill:#fef3c7;stroke:#d97706;stroke-width:2}.unit{fill:#fff;stroke:#94a3b8;stroke-width:1.5}.bus{stroke:#475569;stroke-width:8;fill:none}.flow{stroke:#334155;stroke-width:2;fill:none;marker-end:url(#a)}
    </style>
    <marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#334155"/></marker>
  </defs>
  <rect width="960" height="580" rx="18" fill="#f8fafc"/>
  <text x="480" y="48" text-anchor="middle" class="t">通用计算机：计算、存储与通信</text>
  <rect class="cpu" x="70" y="90" width="500" height="350" rx="16"/><text x="320" y="126" text-anchor="middle" class="h">处理器 CPU</text>
  <g text-anchor="middle">
    <rect class="unit" x="105" y="155" width="125" height="62" rx="9"/><text class="s" x="167" y="184">取指 / PC</text><text class="s" x="167" y="205">Instruction Fetch</text>
    <rect class="unit" x="260" y="155" width="125" height="62" rx="9"/><text class="s" x="322" y="184">译码与</text><text class="s" x="322" y="205">控制单元</text>
    <rect class="unit" x="415" y="155" width="125" height="62" rx="9"/><text class="s" x="477" y="194">寄存器堆</text>
    <rect class="unit" x="145" y="265" width="145" height="70" rx="9"/><text class="h" x="217" y="307">ALU</text>
    <rect class="unit" x="350" y="265" width="145" height="70" rx="9"/><text class="h" x="422" y="307">FPU</text>
    <rect class="unit" x="145" y="365" width="350" height="46" rx="9"/><text class="s" x="320" y="394">L1 / L2 / L3 Cache</text>
  </g>
  <path class="flow" d="M230 186 H255"/><path class="flow" d="M385 186 H410"/><path class="flow" d="M477 220 V258"/><path class="flow" d="M415 300 H298"/><path class="flow" d="M320 335 V360"/>
  <path class="bus" d="M80 500 H890"/><text class="s" x="480" y="535" text-anchor="middle">系统总线 / 片上互连：地址、数据、控制</text>
  <path class="flow" d="M320 440 V492"/>
  <rect class="mem" x="650" y="100" width="240" height="130" rx="15"/><text class="h" x="770" y="148" text-anchor="middle">主存 DRAM</text><text class="s" x="770" y="183" text-anchor="middle">容量大、延迟高于 Cache</text><path class="flow" d="M770 232 V492"/>
  <rect class="io" x="650" y="280" width="240" height="130" rx="15"/><text class="h" x="770" y="326" text-anchor="middle">I/O 与存储</text><text class="s" x="770" y="360" text-anchor="middle">PCIe、SSD、网络、外设</text><path class="flow" d="M770 412 V492"/>
</svg>
