<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="680" viewBox="0 0 1180 680" role="img" aria-labelledby="title desc">
<title id="title">Tomasulo：等待生产者标签，广播结果</title><desc id="desc">保留站保存就绪值或等待标签；CDB广播标签和值，所有匹配源同时抓取，避免年轻写覆盖老读。</desc>
<defs><style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#172033}.title{font-size:30px;font-weight:700}.head{font-size:24px;font-weight:700}.body{font-size:21px}.small{font-size:18px}.code{font-family:Consolas,"Microsoft YaHei",monospace;font-size:21px}</style>
<marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#475569"/></marker>
<marker id="green" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#15803d"/></marker>
<marker id="red" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#b91c1c"/></marker></defs>
<rect width="1180" height="680" fill="#f8fafc"/>
<text x="40" y="55" class="title" text-anchor="start">Tomasulo：等待生产者标签，广播结果</text>
<rect x="40" y="145" width="270" height="190" rx="8" fill="#dbeafe" stroke="#64748b" stroke-width="1.5"/>
<text x="175" y="183" class="head" text-anchor="middle">寄存器结果标签表</text>
<text x="175" y="231" class="body" text-anchor="middle">架构名 → 最新生产者</text>
<text x="175" y="276" class="body" text-anchor="middle">源：读值或记录标签</text>
<text x="175" y="313" class="body" text-anchor="middle">目的：分配新标签</text>
<path d="M310,240 L375,240" fill="none" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="375" y="125" width="420" height="230" rx="8" fill="#e9d5ff" stroke="#64748b" stroke-width="1.5"/>
<text x="585" y="167" class="head" text-anchor="middle">保留站 RS</text>
<text x="400" y="215" class="code" text-anchor="start">DIV：V2 = 旧 F6 = 34</text>
<text x="400" y="258" class="code" text-anchor="start">      Tag1 = MUL 生产者</text>
<text x="400" y="310" class="body" text-anchor="start">等待标签匹配后抓取真正的值</text>
<path d="M795,240 L855,240" fill="none" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="855" y="180" width="270" height="115" rx="8" fill="#dcfce7" stroke="#64748b" stroke-width="1.5"/>
<text x="990" y="223" class="head" text-anchor="middle">功能单元 FU</text>
<text x="990" y="264" class="body" text-anchor="middle">源齐且资源可用才执行</text>
<rect x="115" y="455" width="950" height="75" rx="8" fill="#fef3c7" stroke="#64748b" stroke-width="1.5"/>
<text x="590" y="502" class="head" text-anchor="middle">CDB 广播：(生产者标签，结果值)</text>
<path d="M990,295 L990,455" fill="none" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow)"/>
<path d="M585,455 L585,355" fill="none" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow)"/>
<path d="M175,455 L175,335" fill="none" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="40" y="599" class="body" text-anchor="start">消费者匹配自己等待的标签；只有寄存器当前标签仍匹配，才允许该结果更新它。</text>
<text x="40" y="640" class="small" text-anchor="start">RAW 仍存在；重命名隔离 WAR/WAW，结果广播减少写寄存器再读取的等待。</text>
</svg>
