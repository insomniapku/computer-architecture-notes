<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="730" viewBox="0 0 1180 730" role="img" aria-labelledby="title desc">
<title id="title">精确异常：先保存故障，按年龄报告</title><desc id="desc">年轻Load先发现页故障，老DIV后来发现算术故障。必须先完成更老正确前缀，再报告DIV，取消年轻Load。</desc>
<defs><style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#172033}.title{font-size:30px;font-weight:700}.head{font-size:24px;font-weight:700}.body{font-size:21px}.small{font-size:18px}.code{font-family:Consolas,"Microsoft YaHei",monospace;font-size:21px}</style>
<marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#475569"/></marker>
<marker id="green" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#15803d"/></marker>
<marker id="red" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#b91c1c"/></marker></defs>
<rect width="1180" height="730" fill="#f8fafc"/>
<text x="40" y="55" class="title" text-anchor="start">精确异常：先保存故障，按年龄报告</text>
<text x="40" y="110" class="body" text-anchor="start">硬件时间顺序：ROB5 先检测故障；程序报告顺序：必须先看 ROB4。</text>
<rect x="160" y="155" width="875" height="65" rx="8" fill="#fef3c7" stroke="#64748b" stroke-width="1.5"/>
<text x="190" y="196" class="head" text-anchor="start">ROB1：老 Load</text>
<text x="535" y="196" class="body" text-anchor="start">先 miss，后来得到 200</text>
<rect x="160" y="237" width="875" height="65" rx="8" fill="#dcfce7" stroke="#64748b" stroke-width="1.5"/>
<text x="190" y="278" class="head" text-anchor="start">ROB2：正常指令</text>
<text x="535" y="278" class="body" text-anchor="start">结果 100，已就绪</text>
<rect x="160" y="319" width="875" height="65" rx="8" fill="#dcfce7" stroke="#64748b" stroke-width="1.5"/>
<text x="190" y="360" class="head" text-anchor="start">ROB3：正常指令</text>
<text x="535" y="360" class="body" text-anchor="start">结果 50，已就绪</text>
<rect x="160" y="401" width="875" height="65" rx="8" fill="#fee2e2" stroke="#64748b" stroke-width="1.5"/>
<text x="190" y="442" class="head" text-anchor="start">ROB4：DIV</text>
<text x="535" y="442" class="body" text-anchor="start">Exception=1，先于 ROB5 报告</text>
<rect x="160" y="483" width="875" height="65" rx="8" fill="#fee2e2" stroke="#64748b" stroke-width="1.5"/>
<text x="190" y="524" class="head" text-anchor="start">ROB5：年轻 Load</text>
<text x="535" y="524" class="body" text-anchor="start">Exception=1，随年轻路径取消</text>
<text x="60" y="194" class="code" text-anchor="start">head</text>
<path d="M110,188 L160,188" fill="none" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="597" y="630" class="body" text-anchor="middle">ROB1 就绪后提交 1～3；在 4 处理异常，不能正常提交故障结果。</text>
<text x="40" y="690" class="small" text-anchor="start">按课件“DIV 会陷入”的教学 ISA 假设。RISC-V 的除零 / 浮点标志语义应另行区分。</text>
</svg>
